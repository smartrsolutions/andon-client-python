[project]
name = "andon-client"
version = "1.0.0"
description = "Send values from Python to the Andon app for iPhone and iPad: end-to-end encrypted tiles and widgets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "SMARTR.solutions", email = "support@andon.app" }]
keywords = ["andon", "iphone", "ipad", "dashboard", "widget", "iot"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=3.4",
    "jsonschema>=4.18",
]

[project.urls]
Homepage = "https://andon.app/en/developers"
Source = "https://github.com/smartrsolutions/andon-client-python"
Changelog = "https://github.com/smartrsolutions/andon-client-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/smartrsolutions/andon-client-python/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/andon_client"]

# The parity vectors stay in the repository: 2 MB that only its tests read.
[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "CHANGELOG.md", "LICENSE"]
exclude = ["tests/data/parity.json", "tests/test_parity.py"]
