# Publishes the package to PyPI, started by the tag v<version> that a release
# pushes to this repository. It can also be started by hand for such a tag
# (Actions, "Run workflow", pick the tag), should the push not have started it.
#
# No token: PyPI trusts this workflow in this repository through OIDC ("trusted
# publishing"), from the very first release on (a "pending publisher" can be set
# up for a project that does not exist yet), and the upload carries attestations
# that tie the files to the commit they were built from.
# https://docs.pypi.org/trusted-publishers/
#
# The environment "pypi" is where a required reviewer is configured: the run waits
# there until a person approves it.
name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # the OIDC token PyPI exchanges; also signs the attestations
    steps:
      # Actions are pinned to a commit: a moved tag must not change what publishes.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: The tag names the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi
      # Wheels only: this job can mint the token that publishes, and a package's
      # setup script has no business running next to it.
      - run: 'python -m pip install --only-binary=:all: build==1.6.1'
      - run: python -m build
      # The tests run against the wheel just built, which is what PyPI then gets.
      - run: 'python -m pip install --only-binary=:all: dist/*.whl'
      - run: python -m unittest discover -s tests -t tests
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
